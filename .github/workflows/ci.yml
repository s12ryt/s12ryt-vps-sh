name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -t unformatted < <(gofmt -l .)
          if ((${#unformatted[@]} > 0)); then
            gofmt -d "${unformatted[@]}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  release-build:
    name: Release asset build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Build verified release assets
        shell: bash
        run: bash scripts/build-release.sh build .tmp/release

      - name: Verify release checksums
        shell: bash
        working-directory: .tmp/release
        run: sha256sum -c SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipv6-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            .tmp/release/s12ryt-ipv6-linux-amd64
            .tmp/release/s12ryt-ipv6-linux-arm64
            .tmp/release/SHA256SUMS

  resource-test:
    name: Resource usage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Build resource workload
        shell: bash
        run: |
          mkdir -p .tmp/resource
          go build -trimpath -ldflags '-s -w' \
            -o .tmp/resource/s12ryt-ipv6 \
            ./cmd/s12ryt-ipv6
          go run ./tests/resource/fixture .tmp/resource-profile

      - name: Verify idle resource usage
        shell: bash
        run: |
          sudo --non-interactive /bin/bash scripts/verify-resource-usage.sh verify \
            "$GITHUB_WORKSPACE/.tmp/resource/s12ryt-ipv6" \
            "$GITHUB_WORKSPACE/.tmp/resource-profile"

  test:
    name: Bash tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bats
        id: setup-bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
          shellcheck --external-sources "${files[@]}"

      - name: Run Bats
        shell: bash
        env:
          TERM: xterm
        run: bats --print-output-on-failure tests

      - name: Validate repository documents
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          grep -Fq '版本：`v1.0.3`' README.md
          grep -Fqx 'bash <(curl -fsSL https://raw.githubusercontent.com/s12ryt/s12ryt-vps-sh/main/s12ryt.sh)' README.md
          grep -Fq '固定 `v1.0.3` 實體暫存檔' README.md
          grep -Fq 'https://raw.githubusercontent.com/s12ryt/s12ryt-vps-sh/v1.0.3/s12ryt.sh' README.md
          grep -Fq 'https://raw.githubusercontent.com/s12ryt/s12ryt-vps-sh/v1.0.3/install-proot.sh' README.md
          grep -Fq 'bash -n "$tmp"' README.md
          grep -Fq '會再下載一次完整腳本' README.md
          grep -Fq '按隨意鍵以返回腳本' README.md
          grep -Fq '不會清除 Bash 指令歷史' README.md
          grep -Fq '非互動環境會自動略過清除與等待' README.md
          grep -Fq 'NodeSource setup 腳本沒有獨立 checksum' README.md
          grep -Fq '私有 `uv` 0.12.1' README.md
          grep -Fq 'uv installer 本身沒有獨立 checksum' README.md
          grep -Fq 'kejilion.sh' README.md
          grep -Fq 'ssh_tool.eooce.com' README.md
          grep -Fq 'GNU GENERAL PUBLIC LICENSE' LICENSE
          test "$(git rev-parse HEAD:LICENSE)" = 'f6cdd22a6c1fbc887e08a215cb4beb3c47048041'

  browser-test:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install Playwright package
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

  distribution-smoke:
    name: ${{ matrix.name }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Debian 13
            image: debian:13-slim
            bootstrap: "true"
            manager: apt-get
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            bootstrap: "true"
            manager: apt-get
          - name: CentOS Stream 10
            image: quay.io/centos/centos:stream10
            bootstrap: "true"
            manager: dnf
          - name: Rocky Linux 10
            image: rockylinux/rockylinux:10
            bootstrap: "true"
            manager: dnf
          - name: AlmaLinux 10
            image: almalinux:10
            bootstrap: "true"
            manager: dnf
          - name: Oracle Linux 10
            image: oraclelinux:10
            bootstrap: "true"
            manager: dnf
          - name: Fedora
            image: fedora:latest
            bootstrap: "true"
            manager: dnf
          - name: Alpine 3.23
            image: alpine:3.23
            bootstrap: "apk add --no-cache bash"
            manager: apk
          - name: Arch Linux
            image: archlinux:base
            bootstrap: "true"
            manager: pacman
          - name: openSUSE Leap 16.0
            image: opensuse/leap:16.0
            bootstrap: "true"
            manager: zypper
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run container smoke test
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          BOOTSTRAP: ${{ matrix.bootstrap }}
          EXPECTED_MANAGER: ${{ matrix.manager }}
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e BOOTSTRAP \
            -e EXPECTED_MANAGER \
            "$IMAGE" sh -ec '
              $BOOTSTRAP
              exec bash /workspace/tests/container-smoke.sh "$EXPECTED_MANAGER"
            '
